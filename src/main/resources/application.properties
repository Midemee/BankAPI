spring.config.import=optional:file:.env[.properties]

spring.application.name=bank-transaction-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# update = create tables if missing, add new columns; keeps existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Lets data.sql run after Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
